# Shape: one top-level key per future Astro content collection. Every entry has a
# stable `id` (never rename: the site plan and the KA copy point at them), and the
# same keys wherever they apply:
#   id · kind · title · title_ka · outlet · url · lang (en|ka) · date (YYYY-MM-DD)
#   image (path under assets/) · featured (true = shown on the homepage) · note
# Unknown values are the literal string `tbc`. The site never renders `tbc`:
# see SITE-PLAN.md §10 (placeholder strategy). Nothing the owner sent was dropped;
# the Forbes article, listed twice before, now lives once under `press` and is
# referenced by id from `ventures`.
#
# Astro: load with the `file()` loader (one collection per key) or split into
# src/content/<collection>/<id>.yaml. Either way the ids stay as they are here.

